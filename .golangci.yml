version: "2"

run:
  # Also lint the integration tests and benchmarks (they are behind build tags).
  build-tags:
    - integration
    - bench

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused

  exclusions:
    rules:
      # TODO: migrate from the deprecated protobuf v1 libraries (jhump/protoreflect v1,
      # golang/protobuf) to bufbuild/protocompile + google.golang.org/protobuf dynamicpb.
      # Until then, silence only these two packages' deprecation warnings.
      - linters: [staticcheck]
        text: 'SA1019: "github.com/(jhump/protoreflect|golang/protobuf)/'

formatters:
  enable:
    - gofmt
